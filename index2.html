<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerHelpCube</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <main>
       <section class="cube-section">
            <div class="cubeAndButtons">
                <button type="button" class="control up-left" id="up-left">↖</button>
                <button type="button" class="control up" id="up">↑</button>
                <button type="button" class="control up-right" id="up-right">↗</button>
                <button type="button" class="control left" id="left">←</button>

                <div style="perspective: 100px;" class="cubeBox">
                    <div class="cube" id="cube">
                        <a href="discipline.html" class="face front">
                            <h3>Discipline</h3>
                        </a>
                        <a href="education.html" class="face right-face">
                            <h3>Education</h3>
                        </a>
                        <a href="relationships.html" class="face back">
                            <h3>Relationships</h3>
                        </a>
                        <a href="wellbeing.html" class="face left-face">
                            <h3>Wellbeing</h3>
                        </a>
                        <a href="confidence.html" class="face top-face">
                            <h3>Confidence</h3>
                        </a>
                        <a href="focus.html" class="face bottom-face">
                            <h3>Focus</h3>
                        </a>
                    </div>
                </div>

                <button type="button" class="control right" id="right">→</button>
                <button type="button" class="control down-left" id="down-left">↙</button>
                <button type="button" class="control down" id="down">↓</button>
                <button type="button" class="control down-right" id="down-right">↘</button>
            </div>

            <p>Use the arrows to explore all six sides.</p>
        </section>
    </main>

    <footer>
        <p>CSE6624 Meiirzhan Seitkhan 081011552746 niche-13</p>
        <button href="index2.html" class="secret-btn"></button>
    </footer>

</html>
